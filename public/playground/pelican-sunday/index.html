<script>
const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
let playing = !reducedMotion.matches;
let time = 0, previous = null, soundContext, toastTimer;
function updatePlay(){
  $('play').textContent = playing ? 'Ⅱ' : '▶';
  $('play').setAttribute('aria-label', playing ? '暂停骑行' : '继续骑行');
  $('ride-state').firstChild.textContent = playing ? '正在兜风' : '歇一会儿';
}
$('play').addEventListener('click', () => { playing = !playing; updatePlay(); });
reducedMotion.addEventListener('change', event => { playing = !event.matches; updatePlay(); });

const DAY_LENGTH = 90;
const lerp = (a, b, k) => a + (b - a) * k;
const mix = (c1, c2, k) => {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const [r1, g1, b1] = p(c1), [r2, g2, b2] = p(c2);
  return `rgb(${Math.round(lerp(r1, r2, k))} ${Math.round(lerp(g1, g2, k))} ${Math.round(lerp(b1, b2, k))})`;
};
const clamp01 = v => Math.max(0, Math.min(1, v));
// 天色分段：0=清晨 0.25=正午 0.55=黄昏 0.8=深夜
const PHASES = [
  { at: 0,    sky: '#f4e3cd', far: '#d8c9b2', near: '#b9ab98', water: '#c5c3b4', light: 0.75 },
  { at: 0.25, sky: '#e7eddf', far: '#c7d4bd', near: '#adbea1', water: '#bacfc2', light: 1 },
  { at: 0.55, sky: '#f0c9a2', far: '#c2ab90', near: '#a08d78', water: '#c3b39c', light: 0.8 },
  { at: 0.8,  sky: '#263a4d', far: '#2e4356', near: '#243646', water: '#2b4050', light: 0.4 },
  { at: 1,    sky: '#f4e3cd', far: '#d8c9b2', near: '#b9ab98', water: '#c5c3b4', light: 0.75 },
];
function phase(phaseT){
  let a = PHASES[0], b = PHASES[PHASES.length - 1];
  for (let i = 0; i < PHASES.length - 1; i++) {
    if (phaseT >= PHASES[i].at && phaseT <= PHASES[i + 1].at) { a = PHASES[i]; b = PHASES[i + 1]; break; }
  }
  const k = (phaseT - a.at) / (b.at - a.at || 1);
  return { sky: mix(a.sky, b.sky, k), far: mix(a.far, b.far, k), near: mix(a.near, b.near, k), water: mix(a.water, b.water, k), light: lerp(a.light, b.light, k) };
}
function renderDay(t){
  const phaseT = (t / DAY_LENGTH) % 1;
  const p = phase(phaseT);
  $('sky-fill').style.fill = p.sky;
  $('hill-far').style.fill = p.far;
  $('hill-near').style.fill = p.near;
  $('water').style.fill = p.water;
  // 太阳：0-0.55 沿弧线从左地平线到右地平线；月亮 0.55-1 接班
  const sunK = clamp01(phaseT / 0.55);
  const moonK = clamp01((phaseT - 0.55) / 0.45);
  const arc = (k, r) => { const a = Math.PI * (1 - k); return [600 - Math.cos(a) * 560, 470 - Math.sin(a) * 400]; };
  const [sx, sy] = arc(sunK), [mx, my] = arc(moonK);
  $('sun').setAttribute('cx', sx); $('sun').setAttribute('cy', sy);
  $('sun-halo').setAttribute('cx', sx); $('sun-halo').setAttribute('cy', sy);
  $('sun').style.opacity = sunK > 0 && sunK < 1 ? 1 : 0;
  $('sun-halo').style.opacity = sunK > 0 && sunK < 1 ? .3 : 0;
  $('moon').setAttribute('cx', mx); $('moon').setAttribute('cy', my);
  $('moon-crater').setAttribute('cx', mx); $('moon-crater').setAttribute('cy', my);
  $('moon-craters').setAttribute('transform', `translate(${mx - 770} ${my - 110})`);
  $('moon').style.opacity = moonK > 0 && moonK < 1 ? 1 : 0;
  $('moon-craters').style.opacity = moonK > 0 && moonK < 1 ? 1 : 0;
  $('moon-crater').style.opacity = moonK > 0 && moonK < 1 ? 1 : 0;
  $('stars').style.opacity = p.light < 0.7 ? (0.7 - p.light) * 2.5 : 0;
  $('wind').style.opacity = (.3 + Math.sin(t * 3) * .2) * p.light;
}
const STATIC_WIND_OPACITY = .75;
function render(t){
  const angle = t * 3.4, degrees = angle * 180 / Math.PI;
  const x = Math.cos(angle) * 25, y = Math.sin(angle) * 25;
  $('rear-wheel').setAttribute('transform', `rotate(${degrees})`);
  $('front-wheel').setAttribute('transform', `rotate(${degrees})`);
  $('crank').setAttribute('transform', `translate(569 370) rotate(${degrees})`);
  $('far-crank').setAttribute('transform', `translate(569 370) rotate(${degrees})`);
  $('near-leg-path').setAttribute('d', `M548 279 Q520 316 ${569+x} ${370+y}`);
  $('far-leg-path').setAttribute('d', `M557 279 Q610 315 ${569-x} ${370-y}`);
  $('near-foot').setAttribute('d', `M${557+x} ${370+y}h24`);
  $('far-foot').setAttribute('d', `M${557-x} ${370-y}h24`);
  const bob = Math.sin(angle*2)*1.5;
  $('pelican').setAttribute('transform', `translate(0 ${bob})`);
  const wing = `M554 ${238+bob} Q606 ${276+bob/2} 687 248`;
  $('wing-outline').setAttribute('d', wing);
  $('wing-fill').setAttribute('d', wing);
  $('scarf').setAttribute('transform', `rotate(${Math.sin(t*8)*4} 553 210)`);
  $('road').setAttribute('transform', `translate(${-((t*85)%345)} 0)`);
  $('clouds').setAttribute('transform', `translate(${Math.sin(t*.07)*35} 0)`);
  $('wind').setAttribute('transform', `translate(${-((t*50)%55)} 0)`);
  renderDay(t);
  $('dusk').style.opacity = clamp01((0.75 - phase((t / DAY_LENGTH) % 1).light) * 0.9);
}
function frame(now){
  if(previous !== null && playing && !document.hidden) time += Math.min((now-previous)/1000,.05) * Number($('speed').value);
  previous = now;
  render(time);
  requestAnimationFrame(frame);
}
$('bell').addEventListener('click', async () => {
  const toast = document.querySelector('.toast');
  toast.textContent = '叮铃～'; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1300);
  const Audio = window.AudioContext || window.webkitAudioContext;
  if(!Audio) return;
  try {
    soundContext ||= new Audio();
    await soundContext.resume();
    [0, .13].forEach(delay => {
      const oscillator = soundContext.createOscillator(), gain = soundContext.createGain();
      const start = soundContext.currentTime + delay;
      oscillator.type = 'sine'; oscillator.frequency.value = delay ? 2100 : 1650;
      gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(.12, start+.005); gain.gain.exponentialRampToValueAtTime(.001, start+.65);
      oscillator.connect(gain); gain.connect(soundContext.destination);
      oscillator.start(start); oscillator.stop(start+.7);
    });
  } catch { /* Visual feedback remains available when audio is blocked. */ }
});
updatePlay(); requestAnimationFrame(frame);

// 八音盒式背景音乐：循环旋律 + 柔和低音，默认关闭
let musicOn = false, musicNodes = null;
const MELODY = [ // [半音偏移(相对A4), 拍] 0=休止
  [0,1],[3,1],[7,1],[3,1],[0,1],[-2,1],[0,2],
  [5,1],[3,1],[0,1],[-2,1],[0,1],[3,1],[5,2],
  [7,1],[10,1],[12,1],[10,1],[7,1],[5,1],[3,2],
  [5,1],[3,1],[0,1],[-2,1],[0,1],[3,1],[0,2],
];
const BASS = [ [-12,4],[-9,4],[-14,4],[-12,4] ];
function noteFreq(semi){ return 440 * Math.pow(2, semi / 12); }
function scheduleMusic(ctx, dest, startTime){
  const master = ctx.createGain(); master.gain.value = Number($('music-volume').value);
  master.connect(dest);
  const beat = 0.42;
  let melodyTime = startTime, totalBeats = 0;
  MELODY.forEach(([,b]) => totalBeats += b);
  const loopLength = totalBeats * beat;
  const loops = 40; // 预排约一小时的循环
  for (let loop = 0; loop < loops; loop++) {
    let t = melodyTime;
    MELODY.forEach(([semi, b]) => {
      if (semi !== 0) {
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.value = noteFreq(semi + 12);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .02);
        g.gain.exponentialRampToValueAtTime(.001, t + b * beat * .9);
        osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + b * beat);
      }
      t += b * beat;
    });
    let bassT = melodyTime;
    BASS.forEach(([semi, b]) => {
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = noteFreq(semi - 12);
      g.gain.setValueAtTime(0, bassT); g.gain.linearRampToValueAtTime(.08, bassT + .05);
      g.gain.exponentialRampToValueAtTime(.001, bassT + b * beat * .8);
      osc.connect(g); g.connect(master); osc.start(bassT); osc.stop(bassT + b * beat);
      bassT += b * beat;
    });
    melodyTime += loopLength;
  }
  return { master, stopTime: melodyTime };
}
function startMusic(){
  const Audio = window.AudioContext || window.webkitAudioContext;
  if(!Audio) return;
  soundContext ||= new Audio();
  soundContext.resume().then(() => {
    if (musicNodes) return;
    musicNodes = scheduleMusic(soundContext, soundContext.destination, soundContext.currentTime + 0.1);
    $('music').setAttribute('aria-pressed','true');
    $('music').setAttribute('aria-label','关闭背景音乐');
  }).catch(() => {});
}
function stopMusic(){
  if (musicNodes) {
    const now = soundContext.currentTime;
    musicNodes.master.gain.setTargetAtTime(0, now, 0.1);
    setTimeout(() => { try { musicNodes.master.disconnect(); } catch {} }, 600);
    musicNodes = null;
  }
  $('music').setAttribute('aria-pressed','false');
  $('music').setAttribute('aria-label','开启背景音乐');
}
$('music').addEventListener('click', () => { musicOn = !musicOn; musicOn ? startMusic() : stopMusic(); });
$('music-volume').addEventListener('input', () => {
  if (musicNodes) musicNodes.master.gain.setTargetAtTime(Number($('music-volume').value), soundContext.currentTime, 0.05);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && musicNodes) stopMusic(), musicOn = false; });
</script>
